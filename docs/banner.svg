<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">opencod2-plus</title>
  <desc id="desc">Call of Duty 2 engine, client and dedicated server, for Linux and Windows</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3524"/>
      <stop offset="1" stop-color="#181b12"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="14" fill="#ffffff" opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#stripes)"/>
  <rect x="10" y="10" width="1180" height="260" rx="9" fill="none" stroke="#c9b37e" stroke-opacity="0.35" stroke-width="2"/>

  <!-- three chevrons, as on a sergeant's sleeve -->
  <g fill="none" stroke="#c9b37e" stroke-width="12" stroke-linejoin="miter" stroke-linecap="square">
    <polyline points="88,118 143,88 198,118"/>
    <polyline points="88,148 143,118 198,148"/>
    <polyline points="88,178 143,148 198,178"/>
  </g>

  <text x="250" y="140" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="2" fill="#efe6cf">opencod2<tspan fill="#c9b37e">-plus</tspan></text>
  <text x="254" y="186" font-family="'Courier New', Courier, monospace" font-size="24" fill="#d8ceb4">Call of Duty 2 engine · client &amp; server · Linux &amp; Windows</text>
  <text x="254" y="222" font-family="'Courier New', Courier, monospace" font-size="19" fill="#9c9478">reverse-engineered · work in progress · C++ · CoD2rev-Plus script VM</text>
</svg>
