<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">OpenCoD2-Plus</title>
  <desc id="desc">Call of Duty 2 multiplayer client and dedicated server, versions 1.0, 1.3 and 1.3 Plus, for Linux and Windows, 32 and 64-bit</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3524"/>
      <stop offset="1" stop-color="#181b12"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="14" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <radialGradient id="roundel" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3c4330"/>
      <stop offset="1" stop-color="#1e2217"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#stripes)"/>
  <rect x="10" y="10" width="1180" height="260" rx="9" fill="none" stroke="#c9b37e" stroke-opacity="0.35" stroke-width="2"/>

  <!-- emblem: a faceted star over the 2, in a roundel -->
  <circle cx="150" cy="140" r="108" fill="url(#roundel)" stroke="#c9b37e" stroke-width="5"/>
  <circle cx="150" cy="140" r="98" fill="none" stroke="#c9b37e" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="3 6"/>
  <g><polygon points="150,108 150.0,42.0 164.8,87.6" fill="#e6d29a"/><polygon points="150,108 135.2,87.6 150.0,42.0" fill="#a88f55"/><polygon points="150,108 212.8,87.6 174.0,115.8" fill="#e6d29a"/><polygon points="150,108 164.8,87.6 212.8,87.6" fill="#a88f55"/><polygon points="150,108 188.8,161.4 150.0,133.2" fill="#e6d29a"/><polygon points="150,108 174.0,115.8 188.8,161.4" fill="#a88f55"/><polygon points="150,108 111.2,161.4 126.0,115.8" fill="#e6d29a"/><polygon points="150,108 150.0,133.2 111.2,161.4" fill="#a88f55"/><polygon points="150,108 87.2,87.6 135.2,87.6" fill="#e6d29a"/><polygon points="150,108 126.0,115.8 87.2,87.6" fill="#a88f55"/><polygon points="150.0,42.0 164.8,87.6 212.8,87.6 174.0,115.8 188.8,161.4 150.0,133.2 111.2,161.4 126.0,115.8 87.2,87.6 135.2,87.6" fill="none" stroke="#5e5030" stroke-width="2" stroke-linejoin="round"/></g>
  <text x="140" y="226" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800" fill="#efe6cf">2</text>
  <path d="M180 182v28M166 196h28" stroke="#c9b37e" stroke-width="9" stroke-linecap="round"/>

  <text x="300" y="136" font-family="'Segoe UI', 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="800" fill="#efe6cf">OpenCoD2<tspan fill="#c9b37e">-Plus</tspan></text>
  <text x="304" y="182" font-family="'Segoe UI', 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#d8ceb4">Call of Duty 2 client &amp; server · 1.0 · 1.3 · 1.3 Plus</text>
  <text x="304" y="218" font-family="'Segoe UI', 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#9c9478">Linux · Windows · x86 &amp; x64 — reverse-engineered, with the game's own lighting</text>
</svg>
